<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SoulsCraft · Справочник</title>
<!-- style.css: the shared «Кузня душ» guide stylesheet from RustCraft, byte for byte (fonts in fonts/). -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="soulscraft.css">
</head>
<body>
<a class="skip" href="#main" data-skip>К содержанию</a>
<header class="top">
  <a class="brand" href="#bestiary"><b>SoulsCraft</b><span>Справочник</span></a>
  <button type="button" class="gd-find" id="search-open" aria-haspopup="dialog" aria-keyshortcuts="Control+K" aria-label="Поиск по витрине">
    <svg class="gd-glass" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 10l4.5 4.5" stroke="currentColor" stroke-width="2"/></svg>
    <span aria-hidden="true">Моб, атака, знамя…</span>
    <span class="gd-kbd" aria-hidden="true">Ctrl K</span>
  </button>
  <span class="draft">Версия 0.7.0, числа — гипотезы до плейтестов с людьми</span>
  <button type="button" class="gd-navbtn" id="nav-open" aria-haspopup="dialog" aria-controls="nav" aria-expanded="false">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 3h12M1 7h12M1 11h12" stroke="currentColor" stroke-width="2"/></svg>Разделы
  </button>
</header>
<div id="err" role="alert"></div>
<div class="layout">
  <nav id="nav" aria-label="Мобы, ивенты и алтарь"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="sparks" id="sparks" aria-hidden="true"></div>

<script src="vendor/OrbitControls.js"></script>

<!-- Generated by tools/embed-extra.mjs: loot, recipes, item numbers, names from the lang file. -->

<script src="js/blocks.js"></script>

<script src="js/app.js"></script>
</body>
</html>
