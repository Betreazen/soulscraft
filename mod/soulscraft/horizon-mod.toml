# A level's mob by id through an index rebuilt each level tick.
[[native.module]]
id = "find"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_find"
source = "src/modules/find.rs"

# The bench's self-test scenarios (`soulscraft_selftest run [filter]`).
[[native.module]]
id = "selftest"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_selftest"
