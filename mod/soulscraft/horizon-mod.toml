# ---- Mixins ----
# A HEAD row on a `native_*` entry point is silent unless lib.rs implements the matching Hooks or
# Part method (the game asks `listened` / `has_part_hook` before it calls the entry point), so
# each such row has a gate method there, empty or thin.

# ---- Server ----

# Each level after its tick: the bridge's queues, then the server half (gate: level_tick_post).
[[native.mixin]]
id = "level_tick"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_level_tick_post"
kind = "HEAD"
helper = "src/mixins/level_tick.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "level", ty = "mod_api::LevelRef", value = "level" },
]

# A mob joining a server level, before its first tick: goals, box, flags (gate: entity_join_level).
[[native.mixin]]
id = "entity_join"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_entity_join_level"
kind = "HEAD"
helper = "src/mixins/entity_join.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
]

# /sc, the book's command, the bench's console command, RustCraft's machine kills, as registered
# in lib.rs (gate: run_mod_command).
[[native.mixin]]
id = "run_mod_command"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_run_mod_command"
kind = "HEAD"
helper = "src/mixins/run_mod_command.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "source", ty = "&mod_api::CommandSource", value = "source" },
  { name = "command", ty = "&mod_api::CommandInvocation", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# soulscraft:bleeding's hurt, queued for the level's tick (gate: apply_effect_tick). The call is
# passed by value, so the helper borrows it.
[[native.mixin]]
id = "effect_tick"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_apply_effect_tick"
kind = "HEAD"
helper = "src/mixins/effect_tick.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "call", ty = "&mod_api::__private::ApplyEffectTickCall<'_>", value = "&call" },
]

# Every committed setBlock of an authoritative server. The entry point it calls
# (`native_block_changed`) is #[inline(always)], so the row is on its one caller.
[[native.mixin]]
id = "block_changed"
target = "horizon_client::game::level_access::<GameLevel<'_> as LevelAccess>::observe_block_changed"
kind = "HEAD"
helper = "src/mixins/block_changed.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "old", ty = "BlockStateId", value = "old" },
  { name = "new", ty = "BlockStateId", value = "new" },
]

# A right click on a block (gate: right_click_block).
[[native.mixin]]
id = "right_click_block"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_right_click_block"
kind = "HEAD"
helper = "src/mixins/right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "click", ty = "&BlockClick<'_>", value = "click" },
  { name = "cancellation_result", ty = "&mut mod_api::InteractionResult", value = "&mut *cancellation_result" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# A player about to break a block (gate: break_block).
[[native.mixin]]
id = "break_block"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_break_block"
kind = "HEAD"
helper = "src/mixins/break_block.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

# A position's possible natural spawns (gate: potential_spawns). SoulsCraft has a Hooks impl now,
# so natural spawning asks for them everywhere (`spawn_hooks` is `!mods().is_empty()`): the bundle
# era's `spawn_hooks` row is gone, and the modules filter by dimension.
[[native.mixin]]
id = "potential_spawns"
target = "horizon_client::game::native_hooks::native_potential_spawns::Game<'_>::native_potential_spawns"
kind = "HEAD"
helper = "src/mixins/potential_spawns.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "category", ty = "&str", value = "category" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entries", ty = "&mut Vec<SpawnEntry>", value = "&mut *entries" },
]

# A mob's death, at the function the `living_death` hook is told from; before its listened check,
# so no gate.
[[native.mixin]]
id = "mob_death"
target = "horizon_client::game::native_hooks::living_death::Game<'_>::mob_death_canceled"
kind = "HEAD"
helper = "src/mixins/mob_death.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "mob", ty = "&horizon_client::mobs::Mob", value = "mob" },
]

# The mobs a spawner made.
[[native.mixin]]
id = "spawner_planned"
target = "horizon_client::game::spawner::Game<'_>::add_planned"
kind = "RETURN"
helper = "src/mixins/spawner_planned.rs"
bindings = [
  { name = "value", ty = "std::collections::HashMap<u32, u32>", value = "$value" },
]

# Natural spawning's candidate chunks: an altar sector's chunks come again.
[[native.mixin]]
id = "spawning_chunks"
target = "horizon_client::game::natural_spawning::Game<'a>::spawning_chunks"
kind = "RETURN"
helper = "src/mixins/spawning_chunks.rs"
bindings = [
  { name = "value", ty = "i32", value = "$value" },
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "scratch", ty = "&mut SpawnScratch", value = "&mut *scratch" },
]

# The hardcore guard: `ServerPlayer.die` for a guest.
[[native.mixin]]
id = "guest_die"
target = "horizon_client::game::lan_actions::respawn::Game<'_>::guest_die"
kind = "HEAD"
helper = "src/mixins/guest_die.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "gi", ty = "usize", value = "gi" },
]

# ---- Client ----

