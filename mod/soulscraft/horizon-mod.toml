id = "soulscraft"
name = "SoulsCraft"
version = "0.8.0"
description = """Souls-like enemies (revenant, stalker, marksman, brute, shrike, lurker, bog slime) with
their own rigs, weapons and attacks, the altar and its wave events, trophies and the hunter's book."""
authors = ["SoulsCraft"]
api = "0.2"
# Both halves: the server drives the mobs and the altar, every client draws them. The server
# compares id and version with each joining client.
side = "both"
capabilities = ["registries"]

# The build every row below is written against: a native mod works only on its pinned build.
[native]
game = "26.3"
horizon = "8f83e5c85ae3b9a117f742e8d91170c5c9080a06"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# ---- Support modules: the game glue, compiled in the mirror of `crate::game` ----
# Each is `crate::game::soulscraft_<id>` and sees Game's private items. They call the mod's crate
# as `soulscraft::…` (rules, loot, bridge); the crate cannot call them.

# The old native names over 8f83e5c's (the shared shim's place: see the file's head).
[[native.module]]
id = "compat"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_compat"
source = "src/modules/compat.rs"

# New mobs' goals, box and flags (the bundle era's register_goals hook).
[[native.module]]
id = "goals"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_goals"
source = "src/modules/goals.rs"

# The server half: tracking, stats from P, driving each mob from its brain, damage, clip notes.
[[native.module]]
id = "server"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_server"
source = "src/modules/server.rs"

# The operator's /sc commands, the arena, the test waves and the П5 bench.
[[native.module]]
id = "tools"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_tools"
source = "src/modules/tools.rs"

# The player power P: gear and Path-of-craft-tree's `pct:summary`, read on the level tick.
[[native.module]]
id = "power"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_power"
source = "src/modules/power.rs"

# The client half: the clip notes, the rigs and the drawing, the debug labels.
[[native.module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_client"
source = "src/modules/client.rs"

# The altar on the server: cores, levels, tall pieces, the pedestal, the menu.
[[native.module]]
id = "altar"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_altar"
source = "src/modules/altar.rs"

# The wave event: phases, participants, the path map, drain, curse, breach, reward, restore.
[[native.module]]
id = "event"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_event"
source = "src/modules/event.rs"

[[native.module]]
id = "event_path"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_event_path"
source = "src/modules/event_path.rs"

[[native.module]]
id = "event_ui"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_event_ui"
source = "src/modules/event_ui.rs"

# The altar on the client: the pedestal's item, the ghost, beams and spawn points, the menu.
[[native.module]]
id = "altar_client"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_altar_client"
source = "src/modules/altar_client.rs"

# What players see of an altar: the menu's lines, the views, `/sc altar` and `/sc event`.
[[native.module]]
