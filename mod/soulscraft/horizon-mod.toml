# Their buttons (gate: screen_mouse_button_pressed_pre).
[[native.mixin]]
id = "screen_press"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_mouse_button_pressed_pre"
kind = "HEAD"
helper = "src/mixins/screen_press.rs"
bindings = [
