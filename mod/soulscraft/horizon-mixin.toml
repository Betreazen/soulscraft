helper = "hook_use_item.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# A mob's health ran out (LivingEntity.die): the killer from its last damage and
# `last_hurt_by_player`, before `mob_died` clears it (game/creatures.rs:1585, :1626). The named hook
# `living_death` is behind `mods().is_empty()` there (:1586): at the function, pinned by
# horizon_revision.
[[injection]]
id = "mob_death"
target = "horizon_client::game::creatures::Game<'_>::mob_death_canceled"
kind = "HEAD"
helper = "hook_mob_death.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mob", ty = "&horizon_client::mobs::Mob", value = "m" },
]

# The mobs a spawner made (game/spawner.rs:145; Path-of-craft-tree reads the same ids): a book kill
# of one counts a quarter.
[[injection]]
id = "spawner_planned"
target = "horizon_client::game::spawner::Game<'_>::add_planned"
kind = "RETURN"
helper = "hook_spawner_planned.rs"
bindings = [
  { name = "value", ty = "HashMap<u32, u32>", value = "$value" },
]

# ---- The survival slice (docs/design/10-survival.md) ----

# The hardcore guard (owner's decision, round 2): `ServerPlayer.die` for a guest
# (game/lan_actions.rs:4340, the only death path: death message, drops, death screen; hardcore
# switches to spectator at the respawn, :4071-4085). At its head a participant of a running
# event whose health ran out is kept at 1 health, so the body does nothing; soulscraft_event
# heals them and puts them outside the zone on the next tick. The named `living_death` hook sits
# behind `mods().is_empty()` there (:4343), so a bundle hears it only at the function.
[[injection]]
id = "guest_die"
target = "horizon_client::game::lan_actions::Game<'_>::guest_die"
kind = "HEAD"
helper = "hook_guest_die.rs"
bindings = [
  { name = "host", ty = "&mut crate::game::lan::LanHost", value = "&mut *host" },
  { name = "gi", ty = "usize", value = "gi" },
]

# ---- 0.6: summoning items in the world and the tiers' rewards (docs/design/11-summons-rewards.md) ----

# The tier items' bonuses the engine leaves out: the Abyss Heart's +4 max health in the off hand,
# held through the `attribute` command (relic.rs explains why).
[[module]]
id = "relic"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_relic"
source = "relic.rs"

# The loot crate: chest horns and shards, zombies' Rotten Horn (data/loot.json, copied in by
# mod/sync.ps1). Its helper compiles inside horizon-world, so the crate is horizon-world's.
[[crate]]
id = "loot"
path = "loot"
dependent = "horizon-world"

# Every loot table as it loads (horizon-world/src/loot.rs:589, API 75; docs/native-mods.md «Loot
# tables»), on a server and a client: soulscraft_loot::apply adds the file's pools to the chests
# and zombie tables it names, the same each time.
[[injection]]
id = "loot_table_load"
target = "horizon_world::loot::native_loot_table_load"
kind = "HEAD"
helper = "hook_loot_table_load.rs"
bindings = [
  { name = "id", ty = "&str", value = "id" },
  { name = "table", ty = "&mut serde_json::Value", value = "&mut *table" },
]
