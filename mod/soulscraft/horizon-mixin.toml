hook = "should_apply_effect_tick_this_tick"
hook_version = 1
kind = "HEAD"
helper = "hook_effect_due.rs"
bindings = [
  { name = "effect", ty = "&str", value = "effect" },
  { name = "tick_count", ty = "i32", value = "tick_count" },
  { name = "amplifier", ty = "i32", value = "amplifier" },
  { name = "apply", ty = "&mut bool", value = "&mut *apply" },
]

[[injection]]
id = "effect_tick"
hook = "apply_effect_tick"
hook_version = 1
kind = "HEAD"
helper = "hook_effect_tick.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
