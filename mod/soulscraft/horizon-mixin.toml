# Every committed setBlock of an authoritative server (GameLevel::observe_block_changed,
# game.rs:1388-1392; no mods() check): changes to SoulsCraft's blocks and inside altar zones are
# queued for the level's tick. Read-only level, and it runs inside our own setblocks too: the
# helper takes only its own queue's lock.
[[injection]]
id = "block_changed"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "hook_block_changed.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "old", ty = "horizon_world::registry::BlockStateId", value = "old" },
  { name = "new", ty = "horizon_world::registry::BlockStateId", value = "new" },
]

