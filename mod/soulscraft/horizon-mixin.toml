# SoulsCraft for Horizon, prototype iteration 1 (docs/research/integration.md, section 7: П1–П3 and
# П5's tooling): the seven mobs of the first slice as living types on the zombie template
# (../content, data/soulscraft/horizon/entity_type), each driven by the server from its own
# numbers in data/mobs.json (the rules crate's brain: attacks in windup, hold, hit and recover
# ticks, scaled by the player power P) and drawn by every client from its rig
# (assets/rigs/<mob>.rig.json, read from the content mod) with its weapon at the hand socket.
# Operators get /sc (spawn, power, live reload of the numbers, debug labels, slow motion, the test
# arena, the test zombie waves, forced attacks, the П5 bench) and the joint bench its
# soulscraft_selftest console command. See ../README.md.
#
# Hook guards on 7e4e421 (all paths under SRC/crates/horizon-client/src): mod_api::mods() lists
# only trait mods, and a hook whose caller checks it stays silent for a bundle like this one. The
# named hooks below have no such check: level_tick_post (game/levels.rs:559-561, gated only by
# being a server), register_commands (game/native_server.rs:1328), perform_command
# (native_server.rs:1500), perform_console_command (native_hooks.rs:4636), net_from_server
# (game/native_net.rs:162), mob_submit (game/native_mob_draw.rs:115 from game/creatures.rs:7649),
# living_incoming_damage v1 (native_hooks.rs:9707, called for every hit; only v3 waits for a trait
# mod, 9676-9680, so v1's `causing` may be 0 and the attacker is found by position here),
# should_apply_effect_tick_this_tick and apply_effect_tick (game/potions.rs:1136-1139). Two have no
# catalog entry and are injected at their functions: register_goals
# (mobs/ai.rs:464, called for every new mob at ai.rs:434; its dispatcher only reaches trait mods,
# native_client_hooks.rs:123-127) and world_primitives (game/native_hooks.rs:3001, called each
# frame from game/world_primitives.rs:43).
[mod]
id = "soulscraft"
version = "0.6.0"

# The commit RustCraft and Path-of-craft-tree build on (the joint bench refuses any other).
[compatibility]
horizon_revision = "7e4e421224743469035ba0c34fc21e569e64a17d"

# The game-free rules (`soulscraft-rules`, in code `soulscraft_rules`), compiled and cached apart
# from the game (SRC/docs/native-mods.md:548-566): the data, the brain, rigs, wire format, commands.
[[crate]]
id = "rules"
path = "rules"

# The server half: tracking, stats from P, driving each mob from its brain, damage, clip notes.
[[module]]
id = "server"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_server"
source = "server.rs"

# The operator's /sc commands, the arena, the test waves and the П5 bench.
[[module]]
id = "tools"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_tools"
source = "tools.rs"

# The player power P (Г1): gear and Path-of-craft-tree's `pct:summary`, read on the level tick
# into a cache (another player's data reads None inside a player's action).
[[module]]
id = "power"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_power"
source = "power.rs"

# The bench's self-test scenarios (soulscraft_selftest run).
[[module]]
id = "selftest"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_selftest"
source = "selftest.rs"

# The altar's and the event's self-test scenarios (soulscraft_selftest run altar_|event_|defense_).
[[module]]
id = "selftest_altar"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_selftest_altar"
source = "selftest_altar.rs"

# The client half: the clip notes, the rigs and the drawing, the debug labels.
[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "soulscraft_client"
source = "client.rs"

# ---- Server ----

# Each level after its tick, with its mobs back in it (API 23).
[[injection]]
id = "level_tick"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "hook_level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# A new mob's goals: SoulsCraft's types drop the zombie's attack and target goals, so only the
# server half's brain fights (Mob.registerGoals; at the function: no catalog entry).
[[injection]]
id = "register_goals"
target = "horizon_client_lib::mobs::ai::native_register_goals"
kind = "HEAD"
helper = "hook_register_goals.rs"
bindings = [
  { name = "mob", ty = "&mut crate::mobs::Mob", value = "&mut *mob" },
]

# /sc for operators and soulscraft_selftest for the console (API 8, 99).
[[injection]]
id = "register_commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "hook_register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::mod_api::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "perform_command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "hook_perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::mod_api::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
