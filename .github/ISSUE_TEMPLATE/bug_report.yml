name: Ошибка · Bug report
description: Что-то работает не так, как описано · Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке. Чем точнее шаги, тем быстрее её найдём.
        Thanks for the report. Write in Russian or English.
  - type: input
    id: version
    attributes:
      label: Версия мода · Mod version
      description: "`version` в `mod/soulscraft/horizon-mixin.toml` или тег, с которого ставили · the tag you installed"
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: horizon
    attributes:
      label: Коммит Horizon · Horizon revision
      placeholder: "7e4e421"
  - type: dropdown
    id: where
    attributes:
      label: Где · Where
      options:
        - Одиночная игра · Single player
        - Сервер с хостом (LAN) · LAN host
        - Выделенный сервер · Dedicated server
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги · Steps
      description: Что делали, что ожидали увидеть, что произошло · What you did, what you expected, what happened
      placeholder: |
        1. Встретил громилу в пещере
        2. Отошёл, когда он занёс молот
        3. Ожидал: удар мимо. Произошло: …
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал · Log
      description: Строки с `soulscraft` из журнала игры или сервера · Lines with `soulscraft` from the game or server log
      render: text
